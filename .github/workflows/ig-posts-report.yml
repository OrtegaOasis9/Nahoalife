name: Instagram post ranking report

on:
  workflow_dispatch: {}   # run manually from the Actions tab

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build report
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/ig_posts_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ig-posts-report
          path: reports/*.csv
          retention-days: 7
