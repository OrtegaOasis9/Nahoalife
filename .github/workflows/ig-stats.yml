name: Weekly Instagram stats

on:
  schedule:
    - cron: "43 15 * * 1"   # Mondays, ~8:43am Pacific
  workflow_dispatch: {}      # "Run workflow" button for a manual update

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        id: fetch
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/ig_stats.py

      - name: Save refreshed token
        if: steps.fetch.outputs.new_token != '' && env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.fetch.outputs.new_token }}
        run: gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"

      - name: Commit stats
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feature/stats.json
          git diff --cached --quiet || git commit -m "Weekly Instagram stats"
          git push
