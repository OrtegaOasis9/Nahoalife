<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nahoa Life</title>
<meta name="description" content="Nahoa Life — LA-based rapper, singer, producer, pianist and music content creator.">
<link rel="canonical" href="https://www.nahoalife.com/">
<script>/* old press-kit address: epk.nahoalife.com → the EPK page */ if (location.hostname.indexOf("epk.") === 0) location.replace("/epk/" + location.hash);</script>
<meta property="og:title" content="Nahoa Life">
<meta property="og:description" content="Rapper, singer, producer, pianist and music content creator from LA.">
<meta property="og:image" content="https://www.nahoalife.com/img/home.jpg">
<link rel="preload" as="image" href="img/home.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/sitenav.css">
<style>
  :root { --paper:#F1ECE2; --ink:#140F0B; --butter:#F3D36B; --cherry:#C8322B; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--paper); }
  body { font-family:'Bricolage Grotesque', system-ui, sans-serif; overflow:hidden; }

  /* layered photo: a big soft wash behind, a drifting, less-blurred copy on top */
  .bg, .bg-sharp { position:fixed; inset:-8%; background:url(img/home.jpg) center 40% / cover no-repeat; }
  .bg { filter:blur(28px) saturate(1.35) brightness(.7); transform:scale(1.15) translateZ(0); }
  .bg-sharp {
    filter:blur(3px) saturate(1.2) contrast(1.05) brightness(.9);
    -webkit-mask-image:radial-gradient(ellipse 55% 60% at 55% 48%, #000 35%, transparent 75%);
            mask-image:radial-gradient(ellipse 55% 60% at 55% 48%, #000 35%, transparent 75%);
    animation:drift 26s ease-in-out infinite alternate;
    will-change:transform; transform:translateZ(0); backface-visibility:hidden;
  }
  /* only the position moves; the blur stays fixed (animating blur makes phones flicker) */
  @keyframes drift {
    0%   { transform:translateZ(0) scale(1.04) translate(0, 0); }
    50%  { transform:translateZ(0) scale(1.10) translate(-1.5%, 1%); }
    100% { transform:translateZ(0) scale(1.06) translate(1.2%, -1%); }
  }
  /* warm light leak + grain + vignette */
  .leak { position:fixed; inset:0; pointer-events:none; mix-blend-mode:screen;
    background:radial-gradient(circle at 12% 18%, rgba(255,170,90,.45), transparent 42%),
               radial-gradient(circle at 92% 85%, rgba(200,50,43,.35), transparent 45%); }
  .grain { position:fixed; inset:-50%; pointer-events:none; opacity:.16; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(6) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-4%,3%)} 40%{transform:translate(3%,-2%)} 60%{transform:translate(-2%,-4%)} 80%{transform:translate(4%,2%)} 100%{transform:translate(0,0)} }
  .vignette { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 45%, rgba(10,6,4,.75) 100%); }

  /* content */
  .stage { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:24px clamp(18px, 4vw, 48px) 28px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .mark { font-family:'DM Mono', monospace; font-size:14px; letter-spacing:.06em; color:var(--paper); text-decoration:none; opacity:.85; }
  nav { display:flex; flex-wrap:wrap; gap:8px; }
  nav a { display:inline-flex; align-items:center; min-height:44px; padding:0 18px; border-radius:999px; font-family:'DM Mono', monospace; font-size:14px; color:var(--paper); text-decoration:none;
    border:1.5px solid rgba(241,236,226,.55); background:rgba(20,15,11,.25); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:background .2s, color .2s, border-color .2s; }
  nav a:hover, nav a:focus-visible { background:var(--paper); color:var(--ink); border-color:var(--paper); outline:none; }
  nav a.hot { background:var(--cherry); border-color:var(--cherry); color:#fff; }
  nav a.hot:hover { background:#fff; color:var(--cherry); border-color:#fff; }

  h1 { margin:0; line-height:.82; letter-spacing:-.04em; text-shadow:0 6px 40px rgba(0,0,0,.35); }
  h1 .a { display:block; font-weight:800; font-size:clamp(88px, 19vw, 260px); }
  h1 .b { display:block; font-family:'Instrument Serif', Georgia, serif; font-style:italic; font-weight:400; font-size:clamp(96px, 21vw, 290px); letter-spacing:-.02em; color:var(--butter); margin-left:clamp(40px, 12vw, 220px); }
  .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; font-family:'DM Mono', monospace; font-size:13px; }
  .tag { max-width:340px; line-height:1.5; opacity:.9; }
  .now { opacity:.75; }

  @media (prefers-reduced-motion: reduce) { .bg-sharp, .grain { animation:none; } }
  /* phones and in-app browsers (Instagram, TikTok): keep the grain still and the photo drift gentle */
  @media (hover: none), (max-width: 820px) {
    .grain { animation:none; inset:0; }
    .bg-sharp { animation-duration:40s; }
  }
  @media (max-width:640px) {
    .bg-sharp { -webkit-mask-image:radial-gradient(ellipse 90% 60% at 55% 45%, #000 40%, transparent 80%); mask-image:radial-gradient(ellipse 90% 60% at 55% 45%, #000 40%, transparent 80%); }
    header { flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-sharp" role="img" aria-label="Nahoa Life singing at his keyboards, motion-blurred"></div>
  <div class="leak" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <header>
      <a class="mark" href="/">nahoalife.com</a>
      <div data-sitenav></div>
    </header>

    <h1><span class="a">nahoa</span><span class="b">life</span></h1>

    <div class="foot">
      <p class="tag">rapper · singer · producer · pianist<br>thoughtful hip-hop colored by folk &amp; jazz — LA</p>
      <p class="now">new single “On The Verge” — <a href="/ontheverge/" style="color:var(--butter)">out now →</a></p>
    </div>
  </main>
<script src="/assets/sitenav.js" defer></script>
</body>
</html>
